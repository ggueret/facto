# zizmor - https://github.com/zizmorcore/zizmor
#
# Static analysis for GitHub Actions workflows: catches workflow injection,
# token leak patterns, and other supply-chain footguns the default linters miss.
# Drops into .github/workflows/zizmor.yml. Pinned to commit SHA.

name: zizmor workflow audit

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  schedule:
    - cron: "0 6 * * 1"

permissions: read-all

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
