# zizmor - https://github.com/zizmorcore/zizmor
#
# Static analysis for GitHub Actions workflows: catches workflow injection,
# token leak patterns, and other supply-chain footguns the default linters miss.
# Drops into .github/workflows/zizmor.yml. Pinned to commit SHA.

name: zizmor workflow audit

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  schedule:
    - cron: "0 6 * * 1"

permissions: read-all

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
